# .deb and .rpm packages of a release binary (nfpm, by build.yml):
#   cp bin/linux-amd64/syg pkg/syg
#   VERSION=1.0.0 ARCH=amd64 nfpm package -p deb -t dist/
name: syg
arch: ${ARCH}
platform: linux
version: ${VERSION}
maintainer: Vishisht <syg@vishisht.tech>
description: A typed language for a Kubernetes service's deployment surface, and the compiler that checks it.
homepage: https://syg.vishisht.tech
license: Syg EULA (https://syg.vishisht.tech/eula)
contents:
  - src: pkg/syg
    dst: /usr/bin/syg
    file_info:
      mode: 0755
  - src: EULA.md
    dst: /usr/share/doc/syg/EULA.md
  - src: PRIVACY.md
    dst: /usr/share/doc/syg/PRIVACY.md
  - src: THIRD_PARTY_NOTICES.txt
    dst: /usr/share/doc/syg/THIRD_PARTY_NOTICES.txt
  # The shell completions and the man page (gen/, from build.yml).
  - src: gen/completions/syg.bash
    dst: /usr/share/bash-completion/completions/syg
  - src: gen/completions/_syg
    dst: /usr/share/zsh/vendor-completions/_syg
    packager: deb
  - src: gen/completions/_syg
    dst: /usr/share/zsh/site-functions/_syg
    packager: rpm
  - src: gen/completions/syg.fish
    dst: /usr/share/fish/vendor_completions.d/syg.fish
  - src: gen/man/syg.1.gz
    dst: /usr/share/man/man1/syg.1.gz
