name: image
description: >
  The image of a release, from its Linux archives in dist/: built for amd64
  and arm64, pushed by digest with no tag, signed with cosign (keyless), and
  attested, its provenance and its SBOM, in the registry. build.yml runs it
  for a release, and rehearse.yml to rehearse one; the signatures name
  whichever workflow ran it.
inputs:
  version:
    description: "the release's version, e.g. 1.0.0"
    required: true
  image:
    description: "the repository to push to, e.g. ghcr.io/vishisht16/syg"
    required: true
  token:
    description: "a token that can push to the registry"
    required: true
outputs:
  digest:
    description: "the digest pushed, sha256:..."
    value: ${{ steps.push.outputs.digest }}
runs:
  using: composite
  steps:
    - name: unpack the Linux binaries, and what comes with them
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        mkdir -p image/doc
        # The runner's CA bundle, Mozilla's certificates under the MPL 2.0,
        # with the notice that says so.
        cp /etc/ssl/certs/ca-certificates.crt image/
        cp /usr/share/doc/ca-certificates/copyright image/ca-certificates.copyright
        for arch in amd64 arm64; do
          mkdir -p "image/linux/$arch"
          tar xzf "dist/syg_${VERSION}_linux_${arch}.tar.gz" -C "image/linux/$arch" syg
        done
        tar xzf "dist/syg_${VERSION}_linux_amd64.tar.gz" -C image/doc EULA.md PRIVACY.md
        # The notices come with every release from rc.4 on; hack/check-image.sh
        # says when one lacks them.
        tar xzf "dist/syg_${VERSION}_linux_amd64.tar.gz" -C image/doc THIRD_PARTY_NOTICES.txt 2>/dev/null || true
    # The Dockerfile only copies files, so both platforms build without
    # emulation, and BuildKit's own image is pinned by digest: this job can
    # sign, and runs nothing that a moving tag can change.
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    # BuildKit's own attestations are unsigned; the signed ones follow.
    - id: push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        provenance: false
        sbom: false
        outputs: type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true
        labels: |
          org.opencontainers.image.title=syg
          org.opencontainers.image.description=A typed language for a Kubernetes service's deployment surface, and the compiler that checks it
          org.opencontainers.image.url=https://syg.vishisht.tech
          org.opencontainers.image.documentation=https://syg.vishisht.tech/container.html
          org.opencontainers.image.source=https://github.com/vishisht16/syg
          org.opencontainers.image.licenses=LicenseRef-Syg-EULA
          org.opencontainers.image.version=${{ inputs.version }}
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - name: sign
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ steps.push.outputs.digest }}
      run: cosign sign --yes "$IMAGE@$DIGEST"
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
    - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
    - name: SBOM
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ steps.push.outputs.digest }}
      run: syft scan "registry:$IMAGE@$DIGEST" --platform linux/amd64 -o spdx-json=image.spdx.json -q
    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ steps.push.outputs.digest }}
        predicate-type: https://spdx.dev/Document/v2.3
        predicate-path: image.spdx.json
        push-to-registry: true
