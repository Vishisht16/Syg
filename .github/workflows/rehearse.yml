name: rehearse

# Rehearses, against a release already published (a pre-release will do),
# what only a final release does, and what a release does before it publishes,
# and publishes nothing:
#   - channels: the Scoop manifest and the Homebrew formula are rendered from
#     the release's SHA256SUMS and pushed as release.yml pushes them
#     (hack/channels.sh), to a branch deleted at once, which proves TAP_TOKEN
#     and the git paths. Then they are installed for real, and the installed
#     syg run: with brew on macOS and Linux, brew test included, and with
#     Scoop on Windows, on both architectures.
#   - image: the image is built from the release's Linux archives by the same
#     action build.yml uses, pushed by digest with no tag, signed and
#     attested, and checked as release.yml checks it, on amd64 and then on
#     arm64. Its signatures name this workflow, not build.yml, so no
#     verification of a release accepts it. The untagged digest it leaves in
#     the registry is harmless.
#   - verify: the release's files, checked as the documentation says
#     (hack/check-release.sh).
# `jobs: image` runs the image and verify jobs alone, for a release whose
# archives the channels' current formula does not fit.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "a published release, e.g. v1.0.0-rc.3"
        required: true
      jobs:
        description: "what to rehearse"
        type: choice
        options: [all, image]
        default: all

permissions:
  contents: read

env:
  SYG_TELEMETRY: "off"
  TAG: ${{ inputs.tag }}

jobs:
  channels:
    if: inputs.jobs == 'all'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: check the tag
        run: |
          printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' \
            || { echo "::error::$TAG is not a release tag (vMAJOR.MINOR.PATCH, with an optional pre-release)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the release's checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir dist
      - name: Scoop
        run: bash hack/channels.sh scoop "${TAG#v}" dist/SHA256SUMS "rehearsal/$GITHUB_RUN_ID"
      - name: Homebrew
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: bash hack/channels.sh brew "${TAG#v}" dist/SHA256SUMS "rehearsal/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifests
          path: |
            bucket/syg.json
            tap/Formula/syg.rb
          if-no-files-found: error

  brew:
    needs: channels
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifests
          path: manifests
      - name: brew install, and brew test
        run: |
          # Linux runners have Homebrew, off the PATH.
          if ! command -v brew >/dev/null; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew tap-new --no-git syg/rehearsal
          cp manifests/tap/Formula/syg.rb "$(brew --repository syg/rehearsal)/Formula/syg.rb"
          brew install syg/rehearsal/syg
          brew test syg/rehearsal/syg
          syg version | tee version.txt
          grep -q "syg ${TAG#v} " version.txt
          ls "$(brew --prefix syg/rehearsal/syg)"

  scoop:
    needs: channels
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifests
          path: manifests
      - name: scoop install
        shell: pwsh
        run: |
          # Scoop's installer, at a commit (ScoopInstaller/Install).
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-WebRequest https://raw.githubusercontent.com/ScoopInstaller/Install/1e2f334083d609986d8c8bc9e31ae8e87c39fab4/install.ps1 -OutFile scoop-install.ps1
          .\scoop-install.ps1 -RunAsAdmin
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop install manifests\bucket\syg.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $line = syg version | Select-Object -First 1
          Write-Output $line
          if (-not $line.StartsWith("syg $($env:TAG.Substring(1)) ")) { exit 1 }
          Get-ChildItem "$env:USERPROFILE\scoop\apps\syg\current"

  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: check the tag
        run: |
          printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' \
            || { echo "::error::$TAG is not a release tag (vMAJOR.MINOR.PATCH, with an optional pre-release)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'syg_*_linux_*.tar.gz' --dir dist
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - id: image
        uses: ./.github/actions/image
        with:
          version: ${{ steps.version.outputs.version }}
          image: ghcr.io/vishisht16/syg
          token: ${{ github.token }}
      - name: check the image
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: bash hack/check-image.sh "ghcr.io/vishisht16/syg@$DIGEST" "${TAG#v}" rehearse.yml dist

  image-arm64:
    needs: image
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: check the image, on arm64
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'syg_*_linux_arm64.tar.gz' --dir dist
          bash hack/check-image.sh "ghcr.io/vishisht16/syg@$DIGEST" "${TAG#v}" rehearse.yml dist

  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: the release's files, checked as the documentation says
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          bash hack/check-release.sh dist "${TAG#v}"
