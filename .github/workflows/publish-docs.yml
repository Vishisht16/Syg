name: publish-docs

# Publishes the documentation a build made, the `docs` artifact of the calling
# run (docs-md/ and docs-urls.txt), for release.yml and docs.yml. The site at
# syg.vishisht.tech is built from this repository's docs/ by
# Vishisht16/syg-site, so the docs are first built into that site here, as
# its main builds it. With `publish`, the Markdown is then committed to docs/,
# with the changelog, the EULA and the privacy statement at the root;
# syg-site's deploy is started for that commit; and every rule's docs_url is
# looked for on the site the domain serves. Without `publish`, nothing is
# published.
on:
  workflow_call:
    inputs:
      publish:
        description: "commit docs/ and publish the site"
        type: boolean
        required: true
      message:
        description: "the message of the commit to docs/"
        type: string
        required: true
    secrets:
      SITE_DISPATCH_TOKEN:
        description: "starts syg-site's deploy (fine-grained: Vishisht16/syg-site, Actions read and write); without it the site follows at syg-site's daily build"
        required: false

permissions:
  contents: read

jobs:
  # The docs as syg-site builds them: a page that does not build into the
  # site is found before anything is published.
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Vishisht16/syg-site
          path: site
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: built
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: site/package.json
          no-cache: true
      - name: build the site from these docs
        run: |
          mkdir -p "$RUNNER_TEMP/syg"
          cp -r built/docs-md "$RUNNER_TEMP/syg/docs"
          cp install.sh install.ps1 "$RUNNER_TEMP/syg/"
          cd site
          bun install --frozen-lockfile
          SYG_DIR="$RUNNER_TEMP/syg" bun run build

  commit:
    needs: site
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      # The push below uses the checkout's credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: built
      - name: commit the docs
        id: commit
        env:
          MESSAGE: ${{ inputs.message }}
        run: |
          rm -rf docs && mv built/docs-md docs
          cp docs/CHANGELOG.md CHANGELOG.md
          cp docs/eula.md EULA.md
          cp docs/privacy.md PRIVACY.md
          git config user.name "syg-release"
          git config user.email "syg-release@users.noreply.github.com"
          git add docs CHANGELOG.md EULA.md PRIVACY.md
          git diff --cached --quiet || git commit -q -m "$MESSAGE"
          # A release's channels job pushes to main at the same time: rebase
          # and retry.
          for _ in 1 2 3; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then
              echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          exit 1

  dispatch:
    needs: commit
    runs-on: ubuntu-24.04
    outputs:
      started: ${{ steps.dispatch.outputs.started }}
    steps:
      - name: build and deploy the site from that commit
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          COMMIT: ${{ needs.commit.outputs.commit }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::SITE_DISPATCH_TOKEN is not set: syg.vishisht.tech shows these docs after syg-site's next daily build"
            exit 0
          fi
          gh workflow run deploy.yml --repo Vishisht16/syg-site --ref main -f ref="$COMMIT"
          echo "started=true" >> "$GITHUB_OUTPUT"

  # The domain serves the docs of that commit, or of a later one, and every
  # rule's docs_url finds its section there (hack/check-site.sh).
  verify:
    needs: [commit, dispatch]
    if: needs.dispatch.outputs.started == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: built
      - name: the site serves these docs
        env:
          COMMIT: ${{ needs.commit.outputs.commit }}
        run: bash hack/check-site.sh https://syg.vishisht.tech built/docs-urls.txt "$COMMIT"
