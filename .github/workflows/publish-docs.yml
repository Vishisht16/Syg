name: publish-docs

# Publishes the documentation a build made, the `docs` artifact of the calling
# run (site/, docs-md/ and docs-urls.txt), for release.yml and docs.yml: the
# Markdown is committed to docs/ here, with the changelog, the EULA and the
# privacy statement at the root, and the site is deployed to syg.vishisht.tech
# with the install scripts beside it, then checked there. Without `publish`,
# the site is only packaged for Pages, which still tests the path.
on:
  workflow_call:
    inputs:
      publish:
        description: "commit docs/ and deploy the site"
        type: boolean
        required: true
      message:
        description: "the message of the commit to docs/"
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: ${{ inputs.publish }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: built
      - name: commit the docs
        if: inputs.publish
        env:
          MESSAGE: ${{ inputs.message }}
        run: |
          rm -rf docs && mv built/docs-md docs
          cp docs/CHANGELOG.md CHANGELOG.md
          cp docs/eula.md EULA.md
          cp docs/privacy.md PRIVACY.md
          git config user.name "syg-release"
          git config user.email "syg-release@users.noreply.github.com"
          git add docs CHANGELOG.md EULA.md PRIVACY.md
          git diff --cached --quiet || git commit -q -m "$MESSAGE"
          # A release's channels job pushes to main at the same time: rebase
          # and retry.
          for _ in 1 2 3; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: the install scripts, at the site's root
        run: cp install.sh install.ps1 built/site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: built/site

  deploy:
    needs: package
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time: a release and docs.yml never race.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The site now served is the one built, and every rule's docs_url finds its
  # section there. A page that answers 200 can still be an older build,
  # without the section a newer rule links to (hack/check-site.sh).
  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: built
      - name: the deployed site is the one built
        run: bash hack/check-site.sh https://syg.vishisht.tech built
