name: docs

# Publishes the documentation between releases, from the private source at any
# commit: its Markdown to docs/ here and the site to syg.vishisht.tech, as a
# final release does (release.yml). Started by hand only, with release.yml's
# guardrails: the source is fetched quietly in the `release` environment, which
# needs approval, and deleted when the build ends, and only the built
# documentation, which is published, leaves the runner.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "the branch, tag or commit of syg-core to build the docs from (HEAD: its default branch)"
        required: true
        default: HEAD
      version:
        description: "the version the site shows (empty: the latest release tag at that commit)"
        required: false
        default: ""
      publish:
        description: "publish (unticked: build and package only)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

env:
  SYG_TELEMETRY: "off"

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: release
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check out the source, with its tags
        env:
          CORE_READ_TOKEN: ${{ secrets.CORE_READ_TOKEN }}
          REF: ${{ inputs.ref }}
        run: bash hack/checkout-core.sh "$REF" tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false
      - name: build
        # The site and its Markdown export, by a binary that carries the
        # version the site shows.
        id: build
        working-directory: core
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ inputs.version }}
        run: |
          version=${VERSION:-$(git describe --tags --abbrev=0 --match 'v*')}
          version=${version#v}
          printf '%s\n' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' \
            || { echo "::error::$version is not a version (MAJOR.MINOR.PATCH, with an optional pre-release)"; exit 1; }
          go build -ldflags "-X github.com/vishisht16/syg/internal/buildinfo.Version=$version" -o "$RUNNER_TEMP/syg-docs" ./cmd/syg
          "$RUNNER_TEMP/syg-docs" docs build -o ../site
          "$RUNNER_TEMP/syg-docs" docs build --markdown -o ../docs-md
          cp CHANGELOG.md ../docs-md/CHANGELOG.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "the documentation, for $version"
      - name: remove the source
        if: always()
        run: rm -rf core
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: |
            site/
            docs-md/
          if-no-files-found: error

  publish:
    needs: build
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-docs.yml
    with:
      publish: ${{ inputs.publish }}
      message: Docs for ${{ needs.build.outputs.version }}
