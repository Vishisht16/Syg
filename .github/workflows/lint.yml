name: lint

# The scripts, workflows and relay in this repository. Safe on pull requests:
# it runs no secret and no source.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck install.sh hack/test-install.sh hack/checkout-core.sh hack/channels.sh hack/check-site.sh
      - name: the relay
        run: node --test relay/relay.test.js
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false
      - name: actionlint
        # Built from its module, which Go checks against the checksum database.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: the install script, against a fake release
        # Any executable stands in for syg: the test is of the installer.
        run: |
          printf '#!/bin/sh\necho "syg 0.0.0"\n' > fake-syg
          chmod +x fake-syg
          sh hack/test-install.sh ./fake-syg
