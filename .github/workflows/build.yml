name: build

# Builds, tests, signs and attests a release, for release.yml. Its signatures
# and its provenance name this workflow, which keeps the build apart from the
# signing:
#   - binaries builds and tests from the private source with read-only
#     permissions, and no token that can sign;
#   - sign and image receive only the finished files, and sign and attest
#     them, running none of the build's code.
# Signing in a reusable workflow, with the build kept out of the jobs that
# sign, is how GitHub's artifact attestations reach SLSA v1.0 Build Level 3.
# Verifiers name this file: --signer-workflow Vishisht16/Syg/.github/workflows/build.yml.
#
# Guardrails, as release.yml's:
#   - The core checkout (hack/checkout-core.sh) uses CORE_READ_TOKEN, which
#     only the `release` environment holds, and it needs approval. The
#     checkout is quiet, and deleted when the job ends.
#   - No caches, and every upload names its files.
#   - Tests run quietly (hack/quiet-test.py).
#   - Third-party actions are pinned by commit.
#   - SYG_TELEMETRY=off.
on:
  workflow_call:
    inputs:
      tag:
        description: "the tag of syg-core to build, e.g. v1.0.0"
        type: string
        required: true
    outputs:
      digest:
        description: "the image's digest, which release.yml tags once the release is published"
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read

env:
  SYG_TELEMETRY: "off"
  TAG: ${{ inputs.tag }}

jobs:
  binaries:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check out the source
        env:
          CORE_READ_TOKEN: ${{ secrets.CORE_READ_TOKEN }}
        run: bash hack/checkout-core.sh "refs/tags/$TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false
      - name: test
        working-directory: core
        run: go test -json ./... 2>/dev/null | python3 ../hack/quiet-test.py
      - name: build
        working-directory: core
        env:
          CGO_ENABLED: "0"
        run: |
          version=${TAG#v}
          flags="-s -w -buildid= -X github.com/vishisht16/syg/internal/buildinfo.Version=$version"
          mkdir -p ../dist ../meta ../gen/completions ../gen/man
          # The licence, the privacy statement and the notices of the
          # components Syg includes travel in every archive and package. The
          # first two come from the documentation; the notices, from the
          # modules this build links, for every platform.
          cp docs/site/eula.md ../EULA.md
          cp docs/site/privacy.md ../PRIVACY.md
          python3 hack/notices.py > ../THIRD_PARTY_NOTICES.txt
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/} ext=""
            [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$flags" -o "../bin/$os-$arch/syg$ext" ./cmd/syg
          done
          # The shell completions, from the binary that completes, and the
          # man page, from the CLI reference, dated by the release's commit
          # so that a rebuild writes the same bytes.
          syg=../bin/linux-amd64/syg
          "$syg" completion bash > ../gen/completions/syg.bash
          "$syg" completion zsh > ../gen/completions/_syg
          "$syg" completion fish > ../gen/completions/syg.fish
          "$syg" completion powershell > ../gen/completions/syg.ps1
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) "$syg" docs man -o ../gen/man/syg.1
          gzip -9n -c ../gen/man/syg.1 > ../gen/man/syg.1.gz
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/} ext=""
            [ "$os" = windows ] && ext=.exe
            name="syg_${version}_${os}_${arch}"
            if [ "$os" = windows ]; then archive="$name.zip"; else archive="$name.tar.gz"; fi
            python3 hack/archive.py "../bin/$os-$arch/syg$ext" "../dist/$archive" \
              ../README.md ../EULA.md ../PRIVACY.md ../THIRD_PARTY_NOTICES.txt \
              completions/syg.bash=../gen/completions/syg.bash completions/_syg=../gen/completions/_syg \
              completions/syg.fish=../gen/completions/syg.fish completions/syg.ps1=../gen/completions/syg.ps1 \
              man/syg.1=../gen/man/syg.1
          done
          # What the source statement says: the commit and tag each archive
          # was built from, and how. The binary records the commit too.
          jq -n --arg tag "$TAG" --arg commit "$(git rev-parse HEAD)" --arg go "$(go env GOVERSION)" \
            --arg flags "-trimpath -ldflags=$flags" \
            '{module: "github.com/vishisht16/syg", tag: $tag, commit: $commit, go: $go, cgo: "0", flags: $flags}' > ../meta/source.json
      - name: release notes
        working-directory: core
        run: python3 hack/release-notes.py "$TAG" > ../meta/notes.md
      - name: documentation
        # The Markdown export of the documentation, from the source at this
        # tag, which syg-site builds the site from, and every rule's docs_url.
        working-directory: core
        env:
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-X github.com/vishisht16/syg/internal/buildinfo.Version=${TAG#v}" -o "$RUNNER_TEMP/syg-docs" ./cmd/syg
          "$RUNNER_TEMP/syg-docs" docs build --markdown -o ../docs-md
          cp CHANGELOG.md ../docs-md/CHANGELOG.md
          # Every rule's docs_url, for publish-docs to find on the deployed site.
          "$RUNNER_TEMP/syg-docs" rules --json | jq -r '.[].docs_url' > ../docs-urls.txt
      - name: remove the source
        if: always()
        run: rm -rf core
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: SBOMs
        # Two per archive, SPDX and CycloneDX, from the binary inside it: its
        # Go modules, as the binary records them.
        run: |
          for d in bin/*-*; do
            os=${d#bin/}; os=${os%-*}; arch=${d##*-}
            ext=tar.gz; [ "$os" = windows ] && ext=zip
            exe=syg; [ "$os" = windows ] && exe=syg.exe
            base="dist/syg_${TAG#v}_${os}_${arch}.$ext"
            syft scan "file:$d/$exe" -o spdx-json="$base.spdx.json" -o cyclonedx-json="$base.cdx.json" -q
          done
      - name: packages
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          version=${TAG#v}
          mkdir -p pkg
          for arch in amd64 arm64; do
            cp "bin/linux-$arch/syg" pkg/syg
            for fmt in deb rpm; do
              VERSION="$version" ARCH="$arch" "$(go env GOPATH)/bin/nfpm" package -f nfpm.yaml -p "$fmt" -t dist/
            done
          done
          # A pre-release's packages are versioned 1.0.0~rc.1, and GitHub names
          # such an asset with "." for "~". Named that way here, before they are
          # checksummed and signed; the version inside the package is unchanged.
          for f in dist/*~*; do
            if [ -e "$f" ]; then mv "$f" "$(printf '%s' "$f" | tr '~' '.')"; fi
          done
      - name: checksums
        run: cd dist && sha256sum syg_* syg-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            dist/
            meta/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: |
            docs-md/
            docs-urls.txt
          if-no-files-found: error

  # Signs what binaries built, and attests it. No checkout: nothing here but
  # pinned actions and these lines runs.
  sign:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write      # keyless signing and attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: .
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign
        run: |
          for f in dist/syg_* dist/syg-* dist/SHA256SUMS; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" >/dev/null
          done
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/syg_*.tar.gz
            dist/syg_*.zip
            dist/syg_*.deb
            dist/syg-*.rpm
      - id: source
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/syg_*.tar.gz
            dist/syg_*.zip
            dist/syg_*.deb
            dist/syg-*.rpm
          predicate-type: https://syg.vishisht.tech/attestations/source/v1
          predicate-path: meta/source.json
      - name: the attestations, as a release file
        # Both bundles, one per line, for offline verification and for
        # Scorecard, which looks for a .intoto.jsonl beside the release.
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SOURCE: ${{ steps.source.outputs.bundle-path }}
        run: jq -c . "$PROVENANCE" "$SOURCE" > "dist/syg_${TAG#v}.intoto.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/
            meta/
          if-no-files-found: error

  # The image, from the signed archives' Linux binaries: pushed by digest,
  # with no tag, then signed and attested. release.yml checks it, and tags it
  # only once the release is published.
  image:
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: .
      - id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - id: image
        uses: ./.github/actions/image
        with:
          version: ${{ steps.version.outputs.version }}
          image: ghcr.io/vishisht16/syg
          token: ${{ github.token }}
