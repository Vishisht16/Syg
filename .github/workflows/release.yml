name: release

# Builds, tests and publishes a Syg release from the private source, in this
# public repository, so every release is built where anyone can watch it and
# carries provenance, while the source stays private. build.yml, a reusable
# workflow, builds, signs and attests; this file checks what it made, as a
# user would, and publishes it only when every check has passed.
#
# Guardrails, so that no source reaches this repository or its logs:
#   - Runs on a tag or by hand, never on a pull request: a fork's workflow
#     never sees the secrets, and no outside change runs here.
#   - The core checkout (hack/checkout-core.sh, in build.yml) uses
#     CORE_READ_TOKEN (read-only, one repository), available only to the
#     `release` environment, which needs approval. It is quiet: git's
#     detached-HEAD message would print the commit's subject.
#   - No caches (a pull request could read a cache), and every upload names
#     its files explicitly: only the release's files and the documentation,
#     which are published, ever leave the runner.
#   - Tests run quietly: hack/quiet-test.py prints how many packages passed,
#     never a test's output, a stack trace or a package name. Failures are
#     read in the CI (vishisht16/syg-ci), which runs the same tests and keeps
#     their output encrypted.
#   - No verbose build flags; the checkout is deleted when the job ends.
#   - Third-party actions are pinned by commit.
#   - Syg's own runs here send no usage statistics (SYG_TELEMETRY=off).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "the tag of syg-core to build, e.g. v1.0.0"
        required: true

permissions:
  contents: read

# One run per tag at a time: a second waits rather than racing it to publish.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  SYG_TELEMETRY: "off"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

# The Ubuntu jobs run on 24.04, not ubuntu-latest, which moves to 26.04 in
# November 2026: what builds a release changes only when this file does.
jobs:
  # Before anyone is asked to approve: the tag must name a release.
  tag:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: check the tag
        run: |
          printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' \
            || { echo "::error::$TAG is not a release tag (vMAJOR.MINOR.PATCH, with an optional pre-release)"; exit 1; }

  build:
    needs: tag
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
    # Named so that build.yml may read it; it exists only in the `release`
    # environment, whose value its binaries job receives.
    secrets:
      CORE_READ_TOKEN: ${{ secrets.CORE_READ_TOKEN }}

  # What a user does: download, verify, run, on each OS, from the archive. On
  # Linux, every check the documentation gives users too, as written.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: macos-latest, os: darwin, arch: arm64}
          - {runner: macos-latest, os: darwin, arch: amd64}  # under Rosetta
          - {runner: windows-latest, os: windows, arch: amd64}
          - {runner: windows-11-arm, os: windows, arch: arm64}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      OS: ${{ matrix.os }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: .
      - name: rosetta
        if: matrix.os == 'darwin' && matrix.arch == 'amd64'
        run: /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license
      - name: verify and unpack
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum --check --ignore-missing SHA256SUMS
          else shasum -a 256 --check --ignore-missing SHA256SUMS; fi
          name="syg_${TAG#v}_${OS}_${ARCH}"
          mkdir bin
          if [ "$OS" = windows ]; then unzip -q "$name.zip" -d bin; else tar xzf "$name.tar.gz" -C bin; fi
          for f in README.md EULA.md PRIVACY.md THIRD_PARTY_NOTICES.txt completions/syg.bash completions/_syg completions/syg.fish completions/syg.ps1 man/syg.1; do
            [ -s "bin/$f" ] || { echo "::error::$f is not in $name"; exit 1; }
          done
      - name: run it
        run: |
          syg=dist/bin/syg; [ "$OS" = windows ] && syg=dist/bin/syg.exe
          "$syg" version | tee version.txt
          grep -q "syg ${TAG#v} " version.txt
          "$syg" init new --service api
          "$syg" check new
          "$syg" build new -o out
          ls out
          printf 'module shop\n\nservice api {\n  image "registry.example.com/api:1.0.0"\n  replicas 1\n  port http 8080\n  resources { cpu 100m, memory 128Mi }\n  disruption { minAvailable 1 }\n  internal :http\n}\n' > shop.syg
          if "$syg" check shop.syg > findings.txt 2>&1; then :; fi
          grep -q "single-replica-budget" findings.txt
          "$syg" explain single-replica-budget | head -3
          "$syg" completion powershell > /dev/null
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        with:
          name: docs
          path: docs-built
      - name: what the documentation says to check
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash hack/check-release.sh dist "${TAG#v}" docs-built/docs-md

  # The image build.yml pushed by digest, checked as a user would run it, on
  # each of its platforms, natively, against the archives.
  image-check:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: .
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: check the image
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: bash hack/check-image.sh "ghcr.io/vishisht16/syg@$DIGEST" "${TAG#v}" build.yml dist

  publish:
    needs: [smoke, image-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: .
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          latest="--latest"; [ -n "$pre" ] && latest="--latest=false"
          gh release create "$TAG" dist/syg_* dist/syg-* dist/SHA256SUMS dist/SHA256SUMS.sigstore.json \
            --title "Syg ${TAG#v}" --notes-file meta/notes.md $pre $latest

  # The image's tags, on the digest that was signed and checked, once the
  # release is out: the version, and for a final release its major and
  # latest. Tagging copies no bytes, so the signatures hold for every tag.
  image-tags:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false
      - name: tag
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          TOKEN: ${{ github.token }}
        run: |
          # Built from its module, which Go checks against the checksum database.
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          crane=$(go env GOPATH)/bin/crane
          printf '%s' "$TOKEN" | "$crane" auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          v=${TAG#v}
          tags=$v
          case "$v" in *-*) ;; *) tags="$v ${v%%.*} latest" ;; esac
          for t in $tags; do
            "$crane" tag "ghcr.io/vishisht16/syg@$DIGEST" "$t"
            [ "$("$crane" digest "ghcr.io/vishisht16/syg:$t")" = "$DIGEST" ] \
              || { echo "::error::ghcr.io/vishisht16/syg:$t is not $DIGEST"; exit 1; }
            echo "ghcr.io/vishisht16/syg:$t = $DIGEST"
          done

  # The documentation of a final release: committed to docs/ here, which
  # syg-site publishes at syg.vishisht.tech. A pre-release builds it into the
  # site the same way, and publishes nothing.
  docs:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/publish-docs.yml
    with:
      publish: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
      message: Docs for ${{ github.event.inputs.tag || github.ref_name }}
    secrets:
      SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}

  channels:
    needs: publish
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    # TAP_TOKEN, which can rewrite the formula users install from, is the
    # `release` environment's: this job waits for approval as the build does.
    environment: release
    permissions:
      contents: write
    steps:
      # The Scoop manifest's push uses the checkout's credentials. Nothing is
      # uploaded from this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: .
      - name: Scoop
        run: bash hack/channels.sh scoop "${TAG#v}" dist/SHA256SUMS main
      - name: Homebrew
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: bash hack/channels.sh brew "${TAG#v}" dist/SHA256SUMS main
