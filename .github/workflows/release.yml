name: release

# Builds, tests and publishes a Syg release from the private source, in this
# public repository, so every release is built where anyone can watch it and
# carries a provenance attestation, while the source stays private.
#
# Guardrails, so that no source reaches this repository or its logs:
#   - Runs on a tag or by hand, never on a pull request: a fork's workflow
#     never sees the secrets, and no outside change runs here.
#   - The core checkout (hack/checkout-core.sh) uses CORE_READ_TOKEN
#     (read-only, one repository), available only to the `release`
#     environment, which needs approval. It is quiet: git's detached-HEAD
#     message would print the commit's subject.
#   - No caches (a pull request could read a cache), and every upload names
#     its files explicitly: only dist/ and the documentation, which is
#     published, ever leave the runner.
#   - Tests run quietly: hack/quiet-test.py prints how many packages passed,
#     never a test's output, a stack trace or a package name. Failures are
#     read in the CI (vishisht16/syg-ci), which runs the same tests and keeps
#     their output encrypted.
#   - No verbose build flags; the checkout is deleted when the job ends.
#   - Third-party actions are pinned by commit.
#   - Syg's own runs here send no usage statistics (SYG_TELEMETRY=off).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "the tag of syg-core to build, e.g. v1.0.0"
        required: true

permissions:
  contents: read

# One run per tag at a time: a second waits rather than racing it to publish.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  SYG_TELEMETRY: "off"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

# The Ubuntu jobs run on 24.04, not ubuntu-latest, which moves to 26.04 in
# November 2026: what builds a release changes only when this file does.
jobs:
  # Before anyone is asked to approve: the tag must name a release.
  tag:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: check the tag
        run: |
          printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' \
            || { echo "::error::$TAG is not a release tag (vMAJOR.MINOR.PATCH, with an optional pre-release)"; exit 1; }

  build:
    needs: tag
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write      # cosign keyless signing and attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check out the source
        env:
          CORE_READ_TOKEN: ${{ secrets.CORE_READ_TOKEN }}
        run: bash hack/checkout-core.sh "refs/tags/$TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false
      - name: test
        working-directory: core
        run: go test -json ./... 2>/dev/null | python3 ../hack/quiet-test.py
      - name: build
        working-directory: core
        env:
          CGO_ENABLED: "0"
        run: |
          version=${TAG#v}
          mkdir -p ../dist
          # The licence, the privacy statement and the notices of the
          # components Syg includes travel in every archive and package. The
          # first two come from the documentation; the notices, from the
          # modules this build links, for every platform.
          cp docs/site/eula.md ../EULA.md
          cp docs/site/privacy.md ../PRIVACY.md
          python3 hack/notices.py > ../THIRD_PARTY_NOTICES.txt
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/} ext=""
            [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -buildid= -X github.com/vishisht16/syg/internal/buildinfo.Version=$version" \
              -o "../bin/$os-$arch/syg$ext" ./cmd/syg
            name="syg_${version}_${os}_${arch}"
            if [ "$os" = windows ]; then archive="$name.zip"; else archive="$name.tar.gz"; fi
            python3 hack/archive.py "../bin/$os-$arch/syg$ext" "../dist/$archive" \
              ../README.md ../EULA.md ../PRIVACY.md ../THIRD_PARTY_NOTICES.txt
          done
      - name: release notes
        working-directory: core
        run: python3 hack/release-notes.py "$TAG" > ../dist/notes.md
      - name: documentation
        # The site and its Markdown export, from the source at this tag, by a
        # binary that carries the release's version (the site shows it).
        working-directory: core
        env:
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-X github.com/vishisht16/syg/internal/buildinfo.Version=${TAG#v}" -o "$RUNNER_TEMP/syg-docs" ./cmd/syg
          "$RUNNER_TEMP/syg-docs" docs build -o ../site
          "$RUNNER_TEMP/syg-docs" docs build --markdown -o ../docs-md
          cp CHANGELOG.md ../docs-md/CHANGELOG.md
      - name: remove the source
        if: always()
        run: rm -rf core
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: SBOMs
        # One per archive, from the binary inside it: its Go modules, as the
        # binary records them.
        run: |
          for d in bin/*-*; do
            os=${d#bin/}; os=${os%-*}; arch=${d##*-}
            ext=tar.gz; [ "$os" = windows ] && ext=zip
            exe=syg; [ "$os" = windows ] && exe=syg.exe
            syft scan "file:$d/$exe" -o spdx-json="dist/syg_${TAG#v}_${os}_${arch}.$ext.sbom.json" -q
          done
      - name: packages
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          version=${TAG#v}
          mkdir -p pkg
          for arch in amd64 arm64; do
            cp "bin/linux-$arch/syg" pkg/syg
            for fmt in deb rpm; do
              VERSION="$version" ARCH="$arch" "$(go env GOPATH)/bin/nfpm" package -f nfpm.yaml -p "$fmt" -t dist/
            done
          done
          # A pre-release's packages are versioned 1.0.0~rc.1, and GitHub names
          # such an asset with "." for "~". Named that way here, before they are
          # checksummed and signed; the version inside the package is unchanged.
          for f in dist/*~*; do
            if [ -e "$f" ]; then mv "$f" "$(printf '%s' "$f" | tr '~' '.')"; fi
          done
      - name: checksums
        run: cd dist && sha256sum syg_* syg-* > SHA256SUMS && cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign
        run: |
          for f in dist/syg_* dist/syg-* dist/SHA256SUMS; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" >/dev/null
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/syg_*.tar.gz
            dist/syg_*.zip
            dist/syg_*.deb
            dist/syg-*.rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: |
            site/
            docs-md/
          if-no-files-found: error

  # What a user does: download, verify, run, on each OS, from the archive.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: macos-latest, os: darwin, arch: arm64}
          - {runner: macos-latest, os: darwin, arch: amd64}  # under Rosetta
          - {runner: windows-latest, os: windows, arch: amd64}
          - {runner: windows-11-arm, os: windows, arch: arm64}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: rosetta
        if: matrix.os == 'darwin' && matrix.arch == 'amd64'
        run: /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license
      - name: verify and unpack
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum --check --ignore-missing SHA256SUMS
          else shasum -a 256 --check --ignore-missing SHA256SUMS; fi
          name="syg_${TAG#v}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir bin
          if [ "${{ matrix.os }}" = windows ]; then unzip -q "$name.zip" -d bin; else tar xzf "$name.tar.gz" -C bin; fi
          for f in README.md EULA.md PRIVACY.md THIRD_PARTY_NOTICES.txt; do
            [ -s "bin/$f" ] || { echo "::error::$f is not in $name"; exit 1; }
          done
      - name: run it
        run: |
          syg=dist/bin/syg; [ "${{ matrix.os }}" = windows ] && syg=dist/bin/syg.exe
          "$syg" version | tee version.txt
          grep -q "syg ${TAG#v} " version.txt
          "$syg" init new --service api
          "$syg" check new
          "$syg" build new -o out
          ls out
          printf 'module shop\n\nservice api {\n  image "registry.example.com/api:1.0.0"\n  replicas 1\n  port http 8080\n  resources { cpu 100m, memory 128Mi }\n  disruption { minAvailable 1 }\n  internal :http\n}\n' > shop.syg
          if "$syg" check shop.syg > findings.txt 2>&1; then :; fi
          grep -q "single-replica-budget" findings.txt
          "$syg" explain single-replica-budget | head -3

  publish:
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          latest="--latest"; [ -n "$pre" ] && latest="--latest=false"
          gh release create "$TAG" dist/syg_* dist/syg-* dist/SHA256SUMS dist/SHA256SUMS.sigstore.json \
            --title "Syg ${TAG#v}" --notes-file dist/notes.md $pre $latest

  image:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: unpack the linux binaries, and what comes with them
        run: |
          mkdir -p image/doc
          # The runner's CA bundle, Mozilla's certificates under the MPL 2.0,
          # with the notice that says so.
          cp /etc/ssl/certs/ca-certificates.crt image/
          cp /usr/share/doc/ca-certificates/copyright image/ca-certificates.copyright
          for arch in amd64 arm64; do
            mkdir -p "image/linux/$arch"
            tar xzf "dist/syg_${TAG#v}_linux_${arch}.tar.gz" -C "image/linux/$arch" syg
          done
          tar xzf "dist/syg_${TAG#v}_linux_amd64.tar.gz" -C image/doc EULA.md PRIVACY.md THIRD_PARTY_NOTICES.txt
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: tags
        id: tags
        run: |
          v=${TAG#v}
          t="ghcr.io/vishisht16/syg:$v"
          case "$v" in *-*) ;; *) t="$t,ghcr.io/vishisht16/syg:latest,ghcr.io/vishisht16/syg:${v%%.*}" ;; esac
          echo "tags=$t" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/vishisht16/syg
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}

  # The documentation of a final release: committed to docs/ here, and published
  # at syg.vishisht.tech with the install scripts beside it. A pre-release
  # packages the site the same way, and publishes nothing.
  docs:
    needs: publish
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-docs.yml
    with:
      publish: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
      message: Docs for ${{ github.event.inputs.tag || github.ref_name }}

  channels:
    needs: publish
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Scoop
        run: bash hack/channels.sh scoop "${TAG#v}" dist/SHA256SUMS main
      - name: Homebrew
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: bash hack/channels.sh brew "${TAG#v}" dist/SHA256SUMS main
