version: 2
updates:
  # Monthly, one pull request per ecosystem: the workflows' actions (pinned
  # by commit) and the relay's npm packages. A version is proposed once it
  # has been out for two weeks.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /relay
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      relay:
        patterns: ["*"]
